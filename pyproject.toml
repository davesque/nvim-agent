[project]
name = "nvim-agent"
version = "0.1.0"
description = "Test suite for the neovim agent skill"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["msgpack>=1.0", "pytest>=8", "ruff>=0.6", "ty>=0.0.1a1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["probes"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]
ignore = ["D1", "D200", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.src]
include = ["tests"]
